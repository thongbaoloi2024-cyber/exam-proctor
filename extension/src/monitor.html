<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giám sát phiên thi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="monitor-body">
  <main>
    <div class="brand"><div class="brand-mark">GS</div><div><h1>Đang chuẩn bị giám sát</h1><div class="muted">Không đóng cửa sổ này khi đang thi</div></div></div>
    <section class="card">
      <div id="monitor-meta" class="monitor-meta"></div>
      <div id="indicators" class="indicator-row"></div>
    </section>
    <section class="card">
      <video id="camera-preview" autoplay muted playsinline></video>
      <p class="muted">Video chỉ được dùng cục bộ để hiển thị trạng thái thiết bị. Bản extension này không truyền video liên tục lên server.</p>
      <div class="actions">
        <button id="start-monitoring" type="button">Kích hoạt giám sát</button>
        <button id="end-session" type="button" class="danger">Kết thúc phiên</button>
      </div>
      <p id="monitor-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="common.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
