<rect x="1010" y="285" width="320" height="100" rx="11" fill="white" stroke="#f59e0b"/><text x="1170" y="314" text-anchor="middle" class="b">Evidence theo phiên</text><text x="1170" y="340" text-anchor="middle" class="t">signals · violations · risk timeline</text><text x="1170" y="363" text-anchor="middle" class="t">state transitions · browser events · snapshot</text>
