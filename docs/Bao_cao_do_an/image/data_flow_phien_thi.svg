<rect x="1010" y="590" width="320" height="100" rx="11" fill="white" stroke="#f59e0b"/><text x="1170" y="619" text-anchor="middle" class="b">Review và Reporting Pipeline</text><text x="1170" y="645" text-anchor="middle" class="t">Aggregate → chart → HTML/PDF</text><text x="1170" y="668" text-anchor="middle" class="t">Kết luận có truy vết theo phiên</text>
