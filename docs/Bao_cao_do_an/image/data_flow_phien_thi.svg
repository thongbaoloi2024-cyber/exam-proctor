<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.h{font:700 25px Segoe UI,Arial;fill:#0f172a}.g{font:700 17px Segoe UI,Arial}.b{font:700 14px Segoe UI,Arial;fill:#0f172a}.t{font:12px Segoe UI,Arial;fill:#334155}.l{font:600 11px Segoe UI,Arial;fill:#475569}.e{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1400" height="900" fill="#f8fafc"/><text x="700" y="40" text-anchor="middle" class="h">LUỒNG DỮ LIỆU CHI TIẾT CỦA MỘT PHIÊN THI</text>
<rect x="30" y="80" width="330" height="730" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="55" y="115" class="g" fill="#075985">THU THẬP TẠI MÁY THÍ SINH</text>
<rect x="65" y="155" width="260" height="65" rx="11" fill="white" stroke="#38bdf8"/><text x="195" y="182" text-anchor="middle" class="b">Webcam</text><text x="195" y="204" text-anchor="middle" class="t">Frame + timestamp cục bộ</text>
<rect x="65" y="270" width="260" height="110" rx="11" fill="white" stroke="#0284c7"/><text x="195" y="298" text-anchor="middle" class="b">Perception và Signal Extractor</text><text x="195" y="325" text-anchor="middle" class="t">Face, landmark, embedding, object</text><text x="195" y="348" text-anchor="middle" class="t">7 signal + confidence + evidence</text><text x="195" y="370" text-anchor="middle" class="t">Không lưu video liên tục</text>
