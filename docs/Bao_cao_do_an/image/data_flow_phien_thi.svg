<rect x="415" y="80" width="500" height="730" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="440" y="115" class="g" fill="#5b21b6">TIẾP NHẬN VÀ KIỂM CHỨNG PHÍA SERVER</text>
<rect x="455" y="155" width="190" height="80" rx="11" fill="white" stroke="#a78bfa"/><text x="550" y="185" text-anchor="middle" class="b">REST API</text><text x="550" y="211" text-anchor="middle" class="t">Join · Auth · Policy</text><rect x="685" y="155" width="190" height="80" rx="11" fill="white" stroke="#a78bfa"/><text x="780" y="185" text-anchor="middle" class="b">WebSocket Gateway</text><text x="780" y="211" text-anchor="middle" class="t">Telemetry · Event · Heartbeat</text>
