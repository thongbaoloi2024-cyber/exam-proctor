<g text-anchor="middle" class="uc">
<text x="520" y="166"><tspan>UC-01 Quản trị nền tảng</tspan><tspan x="520" dy="19">chính sách, tổ chức, nhật ký</tspan></text>
<text x="900" y="166"><tspan>Xem nhật ký kiểm toán</tspan><tspan x="900" dy="19">và trạng thái nền tảng</tspan></text>
<text x="520" y="296"><tspan>UC-02 Quản trị tổ chức</tspan><tspan x="520" dy="19">thành viên, quyền, lời mời</tspan></text>
<text x="900" y="296"><tspan>Cấu hình chính sách</tspan><tspan x="900" dy="19">cấp tổ chức</tspan></text>
<text x="520" y="436"><tspan>UC-03 Tạo và cấu hình</tspan><tspan x="520" dy="19">kỳ thi</tspan></text>
<text x="900" y="436"><tspan>UC-04 Kiểm tra sẵn sàng và</tspan><tspan x="900" dy="19">phân công giám thị</tspan></text>
<text x="520" y="576"><tspan>UC-07 Theo dõi phiên</tspan><tspan x="520" dy="19">thời gian thực</tspan></text>
<text x="900" y="576"><tspan>UC-08 Hậu kiểm minh chứng</tspan><tspan x="900" dy="19">và ghi chú sự cố</tspan></text>
<text x="520" y="716"><tspan>UC-05 Tham gia và</tspan><tspan x="520" dy="19">xác thực thí sinh</tspan></text>
<text x="900" y="716"><tspan>UC-06 Khởi tạo giám sát</tspan><tspan x="900" dy="19">và kiểm tra thiết bị</tspan></text>
<text x="710" y="826"><tspan>UC-09 Kết thúc phiên</tspan><tspan x="710" dy="18">→ UC-10 Sinh và tải báo cáo</tspan></text>
</g>
