# Cấu hình Risk Fusion Engine — xem docs/DATA_SCHEMAS.md mục 6 và
# docs/DIAGRAMS.md mục 3.1/3.2. Giá trị dưới đây là KHỞI TẠO minh hoạ, sẽ
# tinh chỉnh bằng thực nghiệm ở Tuần 14 (docs/DATA_SCHEMAS.md mục 6).
#
# window_sec: độ dài mặc định cửa sổ trượt tính exceed_ratio cho state
# machine từng signal (Tuần 9) - có thể override riêng bằng "window_sec"
# trong từng signal nếu cần (VD IDENTITY re-verify thưa hơn nhiều signal
# khác nên window dài hơn để carry-forward ổn định).
window_sec: 4.0

signals:
  FACE_PRESENCE:
    weight: 2.0
    r_enter_susp: 0.3
    r_exit_susp: 0.15
    r_enter_alert: 0.6
    r_exit_alert: 0.4
    # Tham so dung de KHOI TAO FacePresenceSignal (Tuan 13,
    # src/signals/factory.py) - truoc day hardcode trong main.py.
    absence_threshold_sec: 2.0
  MULTI_FACE:
    weight: 2.0
    r_enter_susp: 0.3
    r_exit_susp: 0.15
    r_enter_alert: 0.6
    r_exit_alert: 0.4
    confidence_threshold: 0.90
  EYE_STATE:
    weight: 1.0
    r_enter_susp: 0.3
    r_exit_susp: 0.15
    r_enter_alert: 0.6
    r_exit_alert: 0.4
    ear_threshold: 0.21
    min_closed_duration_sec: 1.0
  MOUTH_STATE:
    weight: 1.0
    r_enter_susp: 0.3
    r_exit_susp: 0.15
    r_enter_alert: 0.6
    r_exit_alert: 0.4
    open_ratio_threshold: 0.15
    activity_window_sec: 2.0
    activity_ratio_threshold: 0.25
    min_window_coverage_sec: 1.0
  OBJECT_PRESENCE:
    weight: 2.5
    r_enter_susp: 0.2
    r_exit_susp: 0.1
    r_enter_alert: 0.4
    r_exit_alert: 0.25
    min_present_duration_sec: 1.0
  HEAD_POSE:
    weight: 1.0
    r_enter_susp: 0.3
    r_exit_susp: 0.15
    r_enter_alert: 0.6
    r_exit_alert: 0.4
    yaw_threshold_deg: 20.0
    pitch_threshold_deg: 20.0
    min_away_duration_sec: 1.0
  IDENTITY:
    weight: 3.0
    reverify_interval_sec: 30
    cosine_threshold_warn: 0.55
    cosine_threshold_alert: 0.40
    # Truoc Tuan 13, main.py hardcode 0.60/0.45 cho 2 nguong nay (khac voi
    # 0.55/0.40 khai bao o day) - lech nay la bug that da xac nhan (xem
    # docs/KE_HOACH_CHI_TIET_TUAN12.md muc 0). src/signals/factory.py (Tuan
    # 13) doc dung 2 gia tri o day, khong con hardcode rieng trong main.py.
    consecutive_failures_required: 2
    # IDENTITY chỉ re-verify mỗi reverify_interval_sec giây (carry-forward
    # giữa 2 lần verify, xem docs/DIAGRAMS.md mục 3.1) - dùng cùng 4 ngưỡng
    # hysteresis như các signal khác vẫn đúng vì exceeds_threshold carry-
    # forward lặp lại y hệt qua các frame giữa 2 lần verify (không dao động),
    # nên exceed_ratio hội tụ nhanh về 0.0 hoặc 1.0 mà không cần state machine
    # riêng biệt.
    window_sec: 4.0
    r_enter_susp: 0.3
    r_exit_susp: 0.15
    r_enter_alert: 0.6
    r_exit_alert: 0.4

# Cac muc duoi day la cau hinh CAP UNG DUNG (Tuan 13, src/app_config.py) -
# khong lien quan Risk Fusion Engine, nhung gop chung 1 file YAML duy nhat
# theo dung quyet dinh da chot o docs/KE_HOACH_CHI_TIET_TUAN12.md muc 1
# ("khong doi ten file, chi la file cau hinh trung tam duy nhat").
camera:
  source: 0
  window_name: "He thong Giam sat Thi bang CV"

paths:
  sessions_dir: "sessions"

enrollment:
  num_frames: 5
  max_attempts: 5
  # Active liveness co ban: yeu cau chuoi mo -> nham -> mo mat truoc khi
  # chap nhan embedding. Chan anh in tinh; khong thay the anti-spoofing
  # chuyen dung truoc video replay/deepfake.
  require_liveness: true
  liveness_timeout_sec: 20.0
  liveness_min_open_frames: 2
  liveness_min_closed_frames: 2

report:
  auto_generate: true
  auto_open: true
  formats: [html, pdf]

# Ket noi backend (Tuan 12 moi, xem docs/KE_HOACH_PLATFORM.md). enabled:
# false theo mac dinh - giu nguyen luong 1-may cu (khong can join-code, khong
# can docker compose dang chay) cho cac truong hop nhu quay bo test Tuan 16,
# hoac chi muon chay demo cuc bo don gian. Bat len (true) khi muon giam thi
# theo doi qua dashboard.
backend:
  enabled: false
  base_url: "http://localhost:8000"
  ws_url: "ws://localhost:8000"
  # Gui telemetry theo lo thay vi commit DB moi frame.
  telemetry_interval_sec: 1.0

session:
  T_enter: 5.0
  T_exit: 2.5
  # Nguong severity (Tuan 10) - suy ra tu risk_score tai thoi diem sinh
  # ViolationEvent. severity_medium_min = T_enter (vua vuot nguong phien la
  # it nhat MEDIUM); severity_high_min = 2 x T_enter (VD 2 signal trong so
  # cao cung ALERT, hoac 1 signal trong so cao ALERT + nhieu signal phu) -
  # xem giai thich chi tiet o docstring RiskFusionEngine._severity.
  severity_medium_min: 5.0
  severity_high_min: 10.0
